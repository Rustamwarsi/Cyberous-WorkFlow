<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cyberous WorkFlow - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo-section">

                <h1>CYBEROUS</h1>

                <p>WORKFLOW MANAGEMENT SYSTEM</p>

            </div>

            <h2>Welcome Back</h2>

            <p class="subtitle">

                Login to manage projects, tasks and workflow

            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button id="loginButton" class="login-submit" type="submit">

                    Login

                </button>

            </form>


            <p
                id="message"
                class="message"
            ></p>

        </div>

    </div>


    <script src="js/app.js"></script>

</body>

</html>

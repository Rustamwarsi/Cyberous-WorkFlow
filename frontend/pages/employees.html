<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberous Workflow - Employees</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <a class="brand" href="modules.html" aria-label="Open modules overview">
          <div class="brand-mark"></div>
          <div>
            <div>CYBEROUS</div>
            <small>WORKFLOW</small>
          </div>
        </a>
        <ul class="nav-list">
          <li><a class="nav-item" href="dashboard.html">🏠 <span>Dashboard</span></a></li>
          <li><a class="nav-item" href="projects.html">📁 <span>Projects</span></a></li>
          <li><a class="nav-item" href="tasks.html">✅ <span>Tasks</span></a></li>
          <li><a class="nav-item" href="client-requests.html">📨 <span>Client Requests</span></a></li>
          <li><a class="nav-item active" href="employees.html">👥 <span>Employees</span></a></li>
          <li><a class="nav-item" href="reports.html">📊 <span>Reports</span></a></li>
          <li><a class="nav-item" href="calendar.html">📅 <span>Calendar</span></a></li>
          <li><a class="nav-item" href="messages.html">💬 <span>Messages</span> <span class="badge-count">3</span></a></li>
          <li><a class="nav-item" href="settings.html">⚙️ <span>Settings</span></a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="topbar">
          <div class="search-box">
            <span>⌕</span>
            <input type="text" placeholder="Search here..." />
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" type="button">🔔</button>
            <div class="user-pill">
              <div class="avatar"></div>
              <span id="employeeUserName">Admin</span>
              <span>▼</span>
              <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
            </div>
          </div>
        </div>

        <div class="page-header">
          <h1>Employees</h1>
          <button class="primary-btn small-btn" id="toggleEmployeeForm" type="button">+ Add Employee</button>
        </div>

        <div class="employee-form-box" id="employeeFormBox" hidden>
          <h2 id="employeeFormTitle">Add Employee</h2>
          <form id="employeeForm">
            <div class="form-grid compact-grid">
              <label class="field">
                <span>Full Name</span>
                <input type="text" id="employeeName" placeholder="Enter Full Name" required />
              </label>

              <label class="field">
                <span>Role</span>
                <select id="employeeRole" required>
                  <option value="">Select Role</option>
                  <option value="Developer">Developer</option>
                  <option value="Tester">Tester</option>
                  <option value="Manager">Manager</option>
                  <option value="HR Executive">HR Executive</option>
                </select>
              </label>

              <label class="field">
                <span>Email</span>
                <input type="email" id="employeeEmail" placeholder="Enter Email" required />
              </label>

              <label class="field">
                <span>Status</span>
                <select id="employeeStatus">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </label>

              <label class="field">
                <span>Department</span>
                <select id="employeeDepartment" required>
                  <option value="">Select Department</option>
                  <option value="Development">Development</option>
                  <option value="Testing">Testing</option>
                  <option value="DevOps">DevOps</option>
                  <option value="Security">Security</option>
                  <option value="HR">HR</option>
                </select>
              </label>
            </div>
            <div class="form-actions compact-actions">
              <button class="secondary-btn" type="button" id="cancelEmployeeForm">Cancel</button>
              <button class="primary-btn" type="submit">Save Employee</button>
            </div>
          </form>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Employee Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="employeeTableBody"></tbody>
          </table>
        </div>
        <div class="employee-actions-menu" id="employeeActionsMenu" hidden>
          <button class="table-action" type="button" data-action="view">View</button>
          <button class="table-action" type="button" data-action="upload">Upload</button>
          <button class="table-action" type="button" data-action="edit">Edit</button>
          <button class="table-action" type="button" data-action="delete">Delete</button>
        </div>
          <input id="employeePhotoInput" type="file" accept="image/*" hidden />
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberous Workflow - Calendar</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <a class="brand" href="modules.html" aria-label="Open modules overview">
          <div class="brand-mark"></div>
          <div>
            <div>CYBEROUS</div>
            <small>WORKFLOW</small>
          </div>
        </a>
        <ul class="nav-list">
          <li><a class="nav-item" href="dashboard.html">🏠 <span>Dashboard</span></a></li>
          <li><a class="nav-item" href="projects.html">📁 <span>Projects</span></a></li>
          <li><a class="nav-item" href="tasks.html">✅ <span>Tasks</span></a></li>
          <li><a class="nav-item" href="client-requests.html">📨 <span>Client Requests</span></a></li>
          <li><a class="nav-item" href="employees.html">👥 <span>Employees</span></a></li>
          <li><a class="nav-item" href="reports.html">📊 <span>Reports</span></a></li>
          <li><a class="nav-item active" href="calendar.html">📅 <span>Calendar</span></a></li>
          <li><a class="nav-item" href="messages.html">💬 <span>Messages</span> <span class="badge-count">3</span></a></li>
          <li><a class="nav-item" href="settings.html">⚙️ <span>Settings</span></a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="topbar">
          <div class="search-box"><span>⌕</span><input type="text" placeholder="Search here..." /></div>
          <div class="topbar-actions">
            <button class="icon-btn" type="button">🔔</button>
            <div class="user-pill"><div class="avatar"></div><span id="calendarUserName">Admin</span><span>▼</span><button id="logoutBtn" class="logout-btn" type="button">Logout</button></div>
          </div>
        </div>

        <div class="page-header">
          <h1>Calendar</h1>
          <button id="openEventForm" class="primary-btn" type="button">+ New Event</button>
        </div>

        <div id="eventFormCard" class="form-card" hidden>
          <h2 style="margin-bottom:18px;">Add Event</h2>
          <form id="eventForm">
            <div class="form-grid">
              <label class="field"><span>Event Title</span><input id="eventTitle" type="text" placeholder="Enter event title" required /></label>
              <label class="field"><span>Date</span><input id="eventDate" type="date" required /></label>
              <label class="field"><span>Type</span>
                <select id="eventType" required>
                  <option value="Meeting">Meeting</option>
                  <option value="Call">Call</option>
                  <option value="Task">Task</option>
                </select>
              </label>
            </div>
            <div class="form-actions">
              <button id="closeEventForm" class="secondary-btn" type="button">Close</button>
              <button class="primary-btn" type="submit">Save Event</button>
            </div>
            <p id="eventFormMessage" class="client-form-message" role="status"></p>
          </form>
        </div>

        <div class="calendar-shell">
          <div class="calendar-header">
            <h2 id="calendarMonthLabel">Month</h2>
            <div class="calendar-legend">
              <span><i class="legend-dot meeting"></i> Meeting</span>
              <span><i class="legend-dot call"></i> Call</span>
              <span><i class="legend-dot task"></i> Task</span>
            </div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberous Workflow - Client Requests</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <a class="brand" href="modules.html" aria-label="Open modules overview">
          <div class="brand-mark"></div>
          <div>
            <div>CYBEROUS</div>
            <small>WORKFLOW</small>
          </div>
        </a>
        <ul class="nav-list">
          <li><a class="nav-item" href="dashboard.html">🏠 <span>Dashboard</span></a></li>
          <li><a class="nav-item" href="projects.html">📁 <span>Projects</span></a></li>
          <li><a class="nav-item" href="tasks.html">✅ <span>Tasks</span></a></li>
          <li><a class="nav-item active" href="client-requests.html">📨 <span>Client Requests</span></a></li>
          <li><a class="nav-item" href="employees.html">👥 <span>Employees</span></a></li>
          <li><a class="nav-item" href="reports.html">📊 <span>Reports</span></a></li>
          <li><a class="nav-item" href="calendar.html">📅 <span>Calendar</span></a></li>
          <li><a class="nav-item" href="messages.html">💬 <span>Messages</span> <span class="badge-count">3</span></a></li>
          <li><a class="nav-item" href="settings.html">⚙️ <span>Settings</span></a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="topbar">
          <div class="search-box">
            <span>⌕</span>
            <input type="text" placeholder="Search here..." />
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" type="button">🔔</button>
            <div class="user-pill">
              <div class="avatar"></div>
              <span id="requestsUserName">Admin</span>
              <span>▼</span>
              <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
            </div>
          </div>
        </div>

        <div class="page-header">
          <h1>Client Requests</h1>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Client Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Website Need</th>
                <th>Project Type</th>
                <th>Budget</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="requestsBody"></tbody>
          </table>
        </div>

        <section id="requestViewPanel" class="request-view-panel" hidden>
          <div class="request-view-header">
            <h2>Client Request Details</h2>
            <button id="closeRequestView" class="secondary-btn" type="button">Close</button>
          </div>
          <div id="requestViewDetails" class="request-view-details"></div>
        </section>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>

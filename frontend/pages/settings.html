<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberous Workflow - Settings</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <a class="brand" href="modules.html" aria-label="Open modules overview">
          <div class="brand-mark"></div>
          <div>
            <div>CYBEROUS</div>
            <small>WORKFLOW</small>
          </div>
        </a>
        <ul class="nav-list">
          <li><a class="nav-item" href="dashboard.html">🏠 <span>Dashboard</span></a></li>
          <li><a class="nav-item" href="projects.html">📁 <span>Projects</span></a></li>
          <li><a class="nav-item" href="tasks.html">✅ <span>Tasks</span></a></li>
          <li><a class="nav-item" href="client-requests.html">📨 <span>Client Requests</span></a></li>
          <li><a class="nav-item" href="employees.html">👥 <span>Employees</span></a></li>
          <li><a class="nav-item" href="reports.html">📊 <span>Reports</span></a></li>
          <li><a class="nav-item" href="calendar.html">📅 <span>Calendar</span></a></li>
          <li><a class="nav-item" href="messages.html">💬 <span>Messages</span> <span class="badge-count">3</span></a></li>
          <li><a class="nav-item active" href="settings.html">⚙️ <span>Settings</span></a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="topbar">
          <div class="search-box"><span>⌕</span><input type="text" placeholder="Search here..." /></div>
          <div class="topbar-actions">
            <button class="icon-btn" type="button">🔔</button>
            <div class="user-pill"><div class="avatar"></div><span id="settingsUserName">Admin</span><span>▼</span><button id="logoutBtn" class="logout-btn" type="button">Logout</button></div>
          </div>
        </div>

        <div class="page-header">
          <h1>Settings</h1>
        </div>

        <div class="form-card">
          <form id="settingsForm">
            <div class="form-grid">
              <label class="field"><span>Company Name</span><input type="text" id="companyName" /></label>
              <label class="field"><span>Timezone</span><input type="text" id="timezone" /></label>
              <label class="field"><span>Default Language</span><input type="text" id="defaultLanguage" /></label>
              <label class="field"><span>Notifications Enabled</span><select id="notificationsEnabled"><option value="true">Yes</option><option value="false">No</option></select></label>
              <label class="field"><span>Weekly Summary Email</span><select id="weeklySummaryEmail"><option value="true">Yes</option><option value="false">No</option></select></label>
              <label class="field"><span>Dark Mode</span><select id="darkMode"><option value="false">Off</option><option value="true">On</option></select></label>
            </div>
            <div class="form-actions"><button id="saveSettingsButton" class="primary-btn" type="submit">Save Settings</button></div>
            <p id="settingsMessage" class="client-form-message" role="status"></p>
          </form>
        </div>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>

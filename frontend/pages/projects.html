<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberous Workflow - Projects</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <a class="brand" href="modules.html" aria-label="Open modules overview">
          <div class="brand-mark"></div>
          <div>
            <div>CYBEROUS</div>
            <small>WORKFLOW</small>
          </div>
        </a>
        <ul class="nav-list">
          <li><a class="nav-item" href="dashboard.html">🏠 <span>Dashboard</span></a></li>
          <li><a class="nav-item active" href="projects.html">📁 <span>Projects</span></a></li>
          <li><a class="nav-item" href="tasks.html">✅ <span>Tasks</span></a></li>
          <li><a class="nav-item" href="client-requests.html">📨 <span>Client Requests</span></a></li>
          <li><a class="nav-item" href="employees.html">👥 <span>Employees</span></a></li>
          <li><a class="nav-item" href="reports.html">📊 <span>Reports</span></a></li>
          <li><a class="nav-item" href="calendar.html">📅 <span>Calendar</span></a></li>
          <li><a class="nav-item" href="messages.html">💬 <span>Messages</span> <span class="badge-count">3</span></a></li>
          <li><a class="nav-item" href="settings.html">⚙️ <span>Settings</span></a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="topbar">
          <div class="search-box">
            <span>⌕</span>
            <input type="text" placeholder="Search here..." />
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" type="button">🔔</button>
            <div class="user-pill">
              <div class="avatar"></div>
              <span id="projectsUserName">Admin</span>
              <span>▼</span>
              <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
            </div>
          </div>
        </div>

        <div class="page-header">
          <h1>Projects</h1>
          <button class="primary-btn" type="button" data-scroll-target="projectForm">+ Add Project</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Project Name</th>
                <th>Client Name</th>
                <th>Manager</th>
                <th>Start Date</th>
                <th>Deadline</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="projectsBody"></tbody>
          </table>
        </div>

        <section id="projectViewPanel" class="request-view-panel" hidden>
          <div class="request-view-header">
            <h2>Project Details</h2>
            <button id="closeProjectView" class="secondary-btn" type="button">Close</button>
          </div>
          <div id="projectViewDetails" class="request-view-details"></div>
        </section>

        <div class="form-card" id="projectFormCard" hidden>
          <h2 style="margin-bottom:18px;">Add Project</h2>
          <form id="projectForm">
            <div class="form-grid">
              <label class="field">
                <span>Project Name</span>
                <input type="text" id="projectName" placeholder="Enter Project Name" required />
              </label>

              <label class="field">
                <span>Deadline</span>
                <input type="date" id="deadline" required />
              </label>

              <label class="field">
                <span>Client</span>
                <select id="projectClient" required>
                  <option value="">Select Client</option>
                </select>
              </label>

              <label class="field">
                <span>Manager</span>
                <select id="projectManager" required>
                  <option value="">Select Manager</option>
                </select>
              </label>

              <label class="field">
                <span>Start Date</span>
                <input type="date" id="startDate" required />
              </label>

              <label class="field" style="grid-column:1 / -1;">
                <span>Description</span>
                <textarea id="projectDescription" placeholder="Enter Project Description"></textarea>
              </label>

              <label class="field" style="grid-column:1 / -1;">
                <span>Status</span>
                <select id="projectStatus">
                  <option value="Not Started">Not Started</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
              </label>
            </div>

            <div class="form-actions">
              <button id="closeProjectForm" class="secondary-btn" type="button">Close</button>
              <button class="primary-btn" type="submit">Add Project</button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>

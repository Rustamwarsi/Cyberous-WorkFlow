<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberous Workflow - Tasks</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <a class="brand" href="modules.html" aria-label="Open modules overview">
          <div class="brand-mark"></div>
          <div>
            <div>CYBEROUS</div>
            <small>WORKFLOW</small>
          </div>
        </a>
        <ul class="nav-list">
          <li><a class="nav-item" href="dashboard.html">🏠 <span>Dashboard</span></a></li>
          <li><a class="nav-item" href="projects.html">📁 <span>Projects</span></a></li>
          <li><a class="nav-item active" href="tasks.html">✅ <span>Tasks</span></a></li>
          <li><a class="nav-item" href="client-requests.html">📨 <span>Client Requests</span></a></li>
          <li><a class="nav-item" href="employees.html">👥 <span>Employees</span></a></li>
          <li><a class="nav-item" href="reports.html">📊 <span>Reports</span></a></li>
          <li><a class="nav-item" href="calendar.html">📅 <span>Calendar</span></a></li>
          <li><a class="nav-item" href="messages.html">💬 <span>Messages</span> <span class="badge-count">3</span></a></li>
          <li><a class="nav-item" href="settings.html">⚙️ <span>Settings</span></a></li>
        </ul>
      </aside>

      <main class="content">
        <div class="topbar">
          <div class="search-box"><span>⌕</span><input type="text" placeholder="Search here..." /></div>
          <div class="topbar-actions">
            <button class="icon-btn" type="button">🔔</button>
            <div class="user-pill"><div class="avatar"></div><span id="tasksUserName">Admin</span><span>▼</span><button id="logoutBtn" class="logout-btn" type="button">Logout</button></div>
          </div>
        </div>

        <div class="page-header">
          <h1>Tasks</h1>
          <button id="openTaskForm" class="primary-btn" type="button">+ Add Task</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Assignee</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tasksTableBody"></tbody>
          </table>
        </div>

        <div class="form-card task-form-panel" id="taskForm" hidden>
          <h2 id="taskFormTitle" style="margin-bottom:18px;">Add Task</h2>
          <form id="taskFormData">
            <div class="form-grid">
              <label class="field"><span>Task Title</span><input type="text" id="taskTitle" placeholder="Enter Task Title" required /></label>
              <label class="field"><span>Priority</span><select id="taskPriority"><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select></label>
              <label class="field"><span>Status</span><select id="taskStatus"><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></label>
              <label class="field"><span>Assignee</span><input type="text" id="taskAssignee" placeholder="Assignee Name" required /></label>
            </div>
            <div class="form-actions">
              <button id="closeTaskForm" class="secondary-btn" type="button">Close</button>
              <button id="submitTaskButton" class="primary-btn" type="submit">Add Task</button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>
